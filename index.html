<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#00151e">
<title>Ayoub Possible</title>
<link rel="stylesheet" href="style.css">
<script src="trailer.js" defer></script>
</head>
<body data-scene="intro">
<main aria-label="Ayoub Possible">
  <div class="background" aria-hidden="true"></div>
  <button class="entry" type="button">
    <img class="entry-disney" src="disney.png" alt="Disney’s">
    <img class="entry-title" src="title.png" alt="Ayoub Possible">
    <span>CLICK TO ENTER</span>
  </button>
  <div class="shelf" inert>
    <div class="case">
      <img src="poster.jpg" alt="Ayoub Possible film poster" draggable="false">
      <div class="gloss" aria-hidden="true"></div>
      <button type="button" class="watch" aria-label="Watch trailer"></button>
    </div>
  </div>
  <audio src="theme.mp3" loop preload="auto"></audio>
  <div class="orientation" role="img" aria-label="Rotate your phone">
    <svg viewBox="0 0 220 220" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M51 57a80 80 0 0 1 122 4m-15-4 15 4-1-15M169 163a80 80 0 0 1-122-4m15 4-15-4 1 15"/>
      <g class="phone">
        <rect x="85" y="63" width="50" height="94" rx="9"/>
        <path d="M105 73h10M106 146h8"/>
      </g>
    </svg>
  </div>
  <video src="film.mp4" playsinline preload="auto" disablepictureinpicture disableremoteplayback tabindex="-1" aria-label="Ayoub Possible trailer"></video>
  <p class="error" role="status" dir="rtl" hidden>تعذّر تشغيل الفيديو. اضغط على الزر للمحاولة مجددًا.</p>
</main>
</body>
</html>
